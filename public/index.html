<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Shell</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='10' fill='none' stroke='%235ee7ff' stroke-width='3'/><circle cx='16' cy='16' r='4' fill='%235ee7ff'/></svg>" />
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>

  <!-- The canvas world. Documents live here; the camera flies between them. -->
  <div id="viewport">
    <div id="world">
      <svg id="links" aria-hidden="true"></svg>
      <div id="docs"></div>
    </div>
  </div>

  <!-- HUD: top bar -->
  <header id="hud-top">
    <button class="hud-btn" id="btn-threads" title="Threads (T)" aria-label="Threads">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
    </button>
    <div class="brand"><span class="brand-ring"></span>SHELL</div>
    <div class="thread-title" id="thread-title">—</div>
    <nav id="constellation" aria-label="Documents in this thread"></nav>
    <div class="hud-right">
      <button class="hud-btn" id="btn-overview" title="Overview (O)" aria-label="Overview">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      </button>
      <button class="hud-btn" id="btn-new" title="New thread (N)" aria-label="New thread">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <div class="status" id="status"><span class="dot"></span><span class="status-text">…</span></div>
      <div class="clock" id="clock"></div>
    </div>
  </header>

  <!-- Prev / next -->
  <button class="edge-nav left" id="nav-prev" aria-label="Previous document (←)"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button class="edge-nav right" id="nav-next" aria-label="Next document (→)"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>

  <!-- Notes panel -->
  <aside id="notes-panel" aria-label="Your notes">
    <div class="panel-head">
      <span class="label">NOTES</span>
      <span class="count" id="notes-count">0</span>
      <button class="panel-close" id="notes-close" aria-label="Close notes">×</button>
    </div>
    <div id="notes-list"></div>
    <div class="notes-empty" id="notes-empty">
      <p><b>React right in the doc.</b></p>
      <p>Select any words, then pick <kbd>Note</kbd> or a quick reaction.</p>
      <p>Or tap the <span class="gutter-demo">+</span> beside a paragraph.</p>
      <p>When you're done, hit <kbd>Send</kbd>. Your notes go back together.</p>
    </div>
  </aside>

  <!-- Selection popover -->
  <div id="popover" role="dialog" aria-label="React to selection" hidden>
    <div class="pop-quick">
      <button data-quick="Yes" title="Agree / keep (Y)">✓ Yes</button>
      <button data-quick="No" title="Disagree / cut (X)">✕ No</button>
      <button data-quick="Why?" title="Explain (W)">? Why</button>
      <button data-quick="More" title="Expand (M)">+ More</button>
      <button data-action="note" class="primary" title="Write a note (N)">✎ Note</button>
    </div>
    <div class="pop-write" hidden>
      <textarea id="pop-input" rows="2" placeholder="Your note…"></textarea>
      <div class="pop-row"><span class="hint">Enter to save · Esc to cancel</span><button id="pop-save" class="primary">Save</button></div>
    </div>
  </div>

  <!-- Composer -->
  <footer id="composer">
    <div id="attach" hidden>
      <button id="attach-chip" title="Show notes"><span class="attach-count">0</span> notes ready to send</button>
      <button id="attach-clear" title="Discard all notes">clear</button>
    </div>
    <div class="composer-row">
      <div id="orb" aria-hidden="true"><span class="r1"></span><span class="r2"></span><span class="core"></span></div>
      <textarea id="input" rows="1" placeholder="Talk to me — or select text in the doc to leave notes"></textarea>
      <button id="btn-mic" class="hud-btn" title="Speak" aria-label="Speak" hidden>
        <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <button id="btn-send" title="Send (Enter)">Send</button>
    </div>
    <div class="composer-meta" id="composer-meta">↵ send · ⇧↵ new line · ← → move between docs · O overview</div>
  </footer>

  <!-- Threads drawer -->
  <div id="drawer-scrim" hidden></div>
  <aside id="drawer" aria-label="Threads">
    <div class="panel-head"><span class="label">THREADS</span><button class="panel-close" id="drawer-close" aria-label="Close">×</button></div>
    <button id="drawer-new" class="drawer-new">+ New thread</button>
    <div id="thread-list"></div>
  </aside>

  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
