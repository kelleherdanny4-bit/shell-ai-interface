<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Shell</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Caveat:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='10' fill='none' stroke='%23cf4f36' stroke-width='3'/><circle cx='16' cy='16' r='4' fill='%23cf4f36'/></svg>" />
</head>
<body class="chat">
  <!-- The sky, printed in halftone on the GPU -->
  <canvas id="ground" aria-hidden="true"></canvas>

  <!-- Zoomed out: a map of clouds. One level up, this project's chats; two levels up, every project. -->
  <div id="viewport">
    <div id="world">
      <div id="map" aria-label="Chats in this project"></div>
      <div id="sky" aria-label="All projects"></div>
    </div>
  </div>

  <!-- Zoomed in: the chat. Your words float in the sky; replies arrive as clouds. -->
  <main id="chat" aria-label="Chat">
    <div id="feed"></div>
    <div id="spacer" aria-hidden="true"></div>
  </main>

  <header id="hud-top">
    <div class="pill">
      <button class="hud-btn" id="btn-threads" title="All chats (T)" aria-label="All chats">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
      </button>
      <button class="brand" id="brand" title="The sky of projects (P)"><span class="brand-ring"></span>Shell</button>
      <div class="crumbs"><button class="crumb-project" id="crumb-project" title="This project's chats (O)"></button><span class="thread-title" id="thread-title"></span></div>
    </div>
    <div class="hud-right">
      <button class="hud-btn" id="btn-overview" title="Rise (O)" aria-label="Zoom out">
        <svg viewBox="0 0 24 24"><path d="M5 15c-1.7 0-3-1.2-3-2.8S3.3 9.5 5 9.5c.3-2.5 2.4-4.5 5-4.5 2.2 0 4 1.3 4.7 3.2.4-.1.8-.2 1.3-.2 2.5 0 4.5 1.8 4.5 4.2S18.5 16 16 16H5z"/><path d="M12 22v-4M10 20l2-2 2 2"/></svg>
      </button>
      <button class="hud-btn" id="btn-new" title="New chat (N)" aria-label="New chat">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <div class="status" id="status"><span class="dot"></span><span class="status-text">…</span><span class="clock" id="clock"></span></div>
    </div>
  </header>

  <!-- Notes list, for screens too narrow for notes in the margin -->
  <aside id="notes-panel" aria-label="Your notes">
    <div class="panel-head">
      <span class="label">Your notes</span>
      <span class="count" id="notes-count">0</span>
      <button class="panel-close" id="notes-close" aria-label="Close notes">×</button>
    </div>
    <div id="notes-list"></div>
  </aside>

  <!-- Selection popover -->
  <div id="popover" role="dialog" aria-label="React to selection" hidden>
    <div class="pop-quick">
      <button data-quick="Yes" title="Agree / keep (Y)">✓ Yes</button>
      <button data-quick="No" title="Disagree / cut (X)">✕ No</button>
      <button data-quick="Why?" title="Explain (W)">? Why</button>
      <button data-quick="More" title="Expand (M)">+ More</button>
      <button data-action="note" class="primary" title="Write a note (N)">✎ Note</button>
    </div>
    <div class="pop-write" hidden>
      <textarea id="pop-input" rows="2" placeholder="Your note…"></textarea>
      <div class="pop-row"><span class="hint">Enter to save · Esc to cancel</span><button id="pop-save" class="primary">Save</button></div>
    </div>
  </div>

  <!-- Composer: what you type floats in the sky -->
  <footer id="composer">
    <div id="attach" hidden>
      <button id="attach-chip" title="Show notes"><span class="attach-count">0</span> notes ready to send</button>
      <button id="attach-clear" title="Discard all notes">clear</button>
    </div>
    <div class="composer-row">
      <div id="orb" aria-hidden="true"><span class="r1"></span><span class="r2"></span><span class="core"></span></div>
      <textarea id="input" rows="1" placeholder="Say something to the sky"></textarea>
      <button id="btn-mic" class="hud-btn" title="Speak" aria-label="Speak" hidden>
        <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <button id="btn-send" title="Send (Enter)">Send</button>
    </div>
    <div id="ro-note">From the Claude app. Read-only here: open it in the Claude app to keep going.</div>
    <div class="composer-meta" id="composer-meta">Enter to send · select words in a reply to leave a note · O to rise</div>
  </footer>

  <!-- All chats, by project -->
  <div id="drawer-scrim" hidden></div>
  <aside id="drawer" aria-label="All chats">
    <div class="panel-head"><span class="label">Chats</span><button class="panel-close" id="drawer-close" aria-label="Close">×</button></div>
    <div id="drawer-list"></div>
    <button id="drawer-sky" class="drawer-sky">Rise into the sky of all projects</button>
  </aside>

  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
